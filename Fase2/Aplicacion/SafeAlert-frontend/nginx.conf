# Las páginas del backend conservan su propia CSP con el hash de sus estilos.
map $uri $safealert_csp {
    ~^/api(?:/|$) "";
    default "default-src 'self'; script-src 'self' https://unpkg.com/leaflet@1.9.4/dist/leaflet.js; script-src-attr 'none'; style-src 'self' 'nonce-$request_id' https://unpkg.com/leaflet@1.9.4/dist/leaflet.css; style-src-attr 'none'; img-src 'self' data: https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org https://unpkg.com/leaflet@1.9.4/dist/images/; font-src 'self'; connect-src 'self' https://safealert-api-299712175128.southamerica-west1.run.app; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';";
}
map $uri $safealert_cache_control {
    /index.html "no-store";
    default "";
}
server {
    listen 80;
    server_name _;
    server_tokens off;
    add_header Content-Security-Policy $safealert_csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $safealert_cache_control always;
    sub_filter '__SAFEALERT_CSP_NONCE__' '$request_id';
    sub_filter_once off;
    root /usr/share/nginx/html;
    index index.html;

    
    absolute_redirect off;

    
    location = /api {
        proxy_pass https://safealert-api-299712175128.southamerica-west1.run.app/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host safealert-api-299712175128.southamerica-west1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_path / /;
    }

    # Proxy inverso hacia el Backend en Cloud Run para '/api/...'
    location /api/ {
        proxy_pass https://safealert-api-299712175128.southamerica-west1.run.app/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host safealert-api-299712175128.southamerica-west1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_path / /;
    }

    # Ruteo SPA para Angular / Ionic
    location / {
        try_files $uri $uri/ /index.html;
    }
}
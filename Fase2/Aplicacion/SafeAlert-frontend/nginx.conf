server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    
    absolute_redirect off;

    
    location = /api {
        proxy_pass https://safealert-api-299712175128.southamerica-west1.run.app/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host safealert-api-299712175128.southamerica-west1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_path / /;
    }

    # Proxy inverso hacia el Backend en Cloud Run para '/api/...'
    location /api/ {
        proxy_pass https://safealert-api-299712175128.southamerica-west1.run.app/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host safealert-api-299712175128.southamerica-west1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_path / /;
    }

    # Ruteo SPA para Angular / Ionic
    location / {
        try_files $uri $uri/ /index.html;
    }
}